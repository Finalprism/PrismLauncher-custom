name: Yggdrasil 定制版：同步 · 构建 · 发布

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "同步目标：上游标签（如 11.2.0）或分支名（如 develop），留空自动取最新稳定标签"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.ref }}
    steps:
      - name: 检出代码（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置上游与提交身份
        run: |
          git remote add upstream https://github.com/PrismLauncher/PrismLauncher.git 2>/dev/null \
            || git remote set-url upstream https://github.com/PrismLauncher/PrismLauncher.git
          git fetch upstream --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 确定同步目标
        id: target
        env:
          TARGET_REF: ${{ github.event.inputs.ref }}
        run: |
          TARGET="$TARGET_REF"
          if [ -z "$TARGET" ]; then
            TARGET=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          fi
          if ! git rev-parse --verify "$TARGET^{commit}" >/dev/null 2>&1; then
            echo "::error::上游不存在目标 $TARGET（标签或分支名拼写是否正确？）"
            exit 1
          fi
          echo "ref=$TARGET" >> "$GITHUB_OUTPUT"
          echo "同步目标：$TARGET"

      - name: 合并上游到当前分支
        id: merge
        run: |
          if git merge "${{ steps.target.outputs.ref }}" --no-edit; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "合并完成，新 HEAD：$(git log --oneline -1)"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "::error::存在合并冲突，已中止合并（分支保持原状）。冲突文件如下，请本地解决后重试："
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi

      - name: 推送到本仓库
        if: steps.merge.outputs.merged == 'true'
        run: |
          git push origin HEAD
          echo "已推送，本次同步完成。"

  build-windows:
    name: 构建 Windows 产物（MSVC x64）
    needs: sync
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_NAME: Windows-MSVC-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: Release
      CMAKE_PRESET: windows_msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.10.2

      - name: Configure project
        run: cmake --preset "$CMAKE_PRESET"

      - name: Run build
        run: cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      - name: Get short version
        id: short-version
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        uses: ./.github/actions/package/windows
        env:
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: Windows-MSVC

  release:
    name: 发布正式 Release
    needs: [sync, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成版本号与更新说明（引用上游 Release）
        id: meta
        env:
          TARGET: ${{ needs.sync.outputs.target }}
        run: |
          if [[ "$TARGET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$TARGET"
            TAG="$TARGET-custom"
          else
            VERSION="$TARGET"
            TAG="$TARGET-custom-$(date +%Y%m%d%H%M)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          UPSTREAM_NOTES=$(gh release view "$TARGET" --repo PrismLauncher/PrismLauncher --json body -q .body 2>/dev/null) || UPSTREAM_NOTES=""
          if [ -z "$UPSTREAM_NOTES" ]; then
            UPSTREAM_NOTES="基于上游 \`$TARGET\` 构建，详见[上游提交历史](https://github.com/PrismLauncher/PrismLauncher/commits/$TARGET)。"
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "$UPSTREAM_NOTES"
            echo ""
            echo "---"
            echo ""
            echo "### 本定制版新增"
            echo "- **Yggdrasil 外置登录**（authlib-injector 兼容，支持 LittleSkin 等外置认证服务器）"
            echo "- 新增外置账户登录对话框与账户页入口，新界面文案已中文化"
            echo ""
            echo "> 基于 [PrismLauncher/PrismLauncher](https://github.com/PrismLauncher/PrismLauncher) \`$TARGET\` 合并构建"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          gh release delete "$TAG" --repo "${{ github.repository }}" -y >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          cd dist
          zip -r "../PrismLauncher-$VERSION-yggdrasil.zip" .
          cd ..
          gh release create "$TAG" "PrismLauncher-$VERSION-yggdrasil.zip" \
            --repo "${{ github.repository }}" \
            --title "Prism Launcher $VERSION（Yggdrasil 定制版）" \
            --notes "$NOTES"
